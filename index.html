<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/sandbagger-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f2" />
    <title>Sandbagger</title>

    <!-- Installable, so it lands on a home screen instead of in a pile of
         browser tabs.
         The group is all on iPhones, and iOS ignores the manifest's icons
         entirely — this next line is the one that decides what they see on
         their home screen. It also has to be opaque: iOS composites any
         transparency onto black rather than onto the home screen. -->
    <link rel="apple-touch-icon" href="/sandbagger-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sandbagger" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- Set here as well as in the stylesheet: launched from an iPhone home
       screen, the first paint happens before the CSS lands, and without
       this it's a white flash against the app's paper. -->
  <body style="background: #f6f6f2">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
