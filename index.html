<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/sandbagger-icon-180.png" />
    <!-- maximum-scale=1 stops iOS zooming in when a text field under 16px
         is tapped (it never zooms back out, which is what knocked the app
         "out of shape"). iOS still lets people pinch to zoom on purpose. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f2" />
    <title>Sandbagger</title>

    <!-- Netlify adds a "Powered by Netlify" badge to the bottom-right of
         every page it hosts (its script is appended after </html> at
         deploy time), and it sits over the app's tab bar. The badge has
         its own "Hide this badge" button, which just stores this key; it
         reads the key before drawing, and this runs first, so nobody ever
         sees it. The style rule covers a phone where storage is blocked,
         and only matches the public badge, not the owner toolbar. -->
    <script>
      try {
        localStorage.setItem('nl-hud:public:v1', 'hidden')
      } catch (e) {}
    </script>
    <style>
      #nl-badge-frame { display: none !important; }
    </style>

    <!-- Installable, so it lands on a home screen instead of in a pile of
         browser tabs.
         The group is all on iPhones, and iOS ignores the manifest's icons
         entirely — this next line is the one that decides what they see on
         their home screen. It also has to be opaque: iOS composites any
         transparency onto black rather than onto the home screen. -->
    <link rel="apple-touch-icon" href="/sandbagger-icon-180.png" />
    <!-- Launch screens: the Saddam on forest while the app loads from the
         home screen, instead of a blank page. iOS only uses one whose
         pixel size matches the phone exactly, hence one per screen size.
         Rebuild with `node scripts/make-splash.mjs`. -->
    <link rel="apple-touch-startup-image" href="/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sandbagger" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- Set here as well as in the stylesheet: launched from an iPhone home
       screen, the first paint happens before the CSS lands, and without
       this it's a white flash against the app's paper. -->
  <body style="background: #f6f6f2">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
