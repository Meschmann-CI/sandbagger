<!-- Supabase → Authentication → Emails → "Confirm signup".
     Sent the first time a golfer signs in. Subject: Your Sandbagger code -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #182019;">
  <h2 style="margin: 0 0 8px; font-size: 20px;">Welcome to Sandbagger</h2>
  <p style="margin: 0 0 20px; font-size: 15px; color: #4a554d;">Enter this code in the app to sign in:</p>
  <p style="margin: 0 0 20px; font-size: 32px; font-weight: 800; letter-spacing: 6px; text-align: center; background: #f6f6f2; border-radius: 12px; padding: 16px;">{{ .Token }}</p>
  <p style="margin: 0; font-size: 13px; color: #68726a;">It only works once and expires soon. If you didn't ask for it, you can ignore this email.</p>
</div>
