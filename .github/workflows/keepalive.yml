# Keeps Supabase's free tier from pausing the project for inactivity
# (free projects pause after 7 days without enough database activity).
# Without this, a quiet December ends with a dead app in April and someone
# digging through a dashboard to un-pause it.
#
# It used to be one read a week. That's not enough: Process Mapper got the
# inactivity warning on 2026-09-29 while its daily read returned 200, and
# Supabase's guidance is "a few user requests to the database each day".
# So this runs four times a day, and each run does a real write
# (keepalive() bumps a heartbeat row, see supabase/schema.sql) plus an
# ordinary table read.
#
# The key below is the anon key. It's public by design (every visitor's
# browser already has it): keepalive() only bumps the heartbeat row, and
# row-level security returns nothing from rounds to the anon key.
name: keep supabase awake
on:
  schedule:
    # Every six hours, at an off-minute on purpose.
    - cron: "43 3,9,15,21 * * *"
  workflow_dispatch: {}

env:
  SUPABASE_URL: https://ebukktjspbgzwnaxobfg.supabase.co
  SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVidWtrdGpzcGJnenduYXhvYmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MDg5MzUsImV4cCI6MjEwMzA4NDkzNX0.12IpyCgKKlmcFujWbLppeYuwVwRDeC3P0LjnGw9fWPc

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write the heartbeat
        run: |
          out=$(curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$out"
          # Fail the run (and email the repo owner) if the function ever
          # stops writing, rather than passing on a read-only answer.
          case "$out" in *"awake, ping "*) ;; *) echo "keepalive() did not write"; exit 1 ;; esac
      - name: Read a table
        run: |
          curl --fail-with-body -sS -o /dev/null -w 'HTTP %{http_code}\n' \
            "$SUPABASE_URL/rest/v1/rounds?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
